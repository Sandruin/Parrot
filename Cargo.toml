[package]
name = "macro-recorder"
version = "0.1.0"
edition = "2024"
description = "Personal macro recorder for Windows: record, edit and replay keyboard and mouse actions"
license = "MIT"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
egui_dnd = "0.17"
egui_material_icons = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
tiny-skia = "0.12"
rfd = "0.17"
spin_sleep = "1.3"
crossbeam-channel = "0.5"
dirs = "6"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_Security",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
] }

[build-dependencies]
embed-manifest = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
